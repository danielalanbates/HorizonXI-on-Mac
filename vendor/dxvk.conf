# Safe throughput options. None alter what is drawn.
d3d9.maxFrameLatency = 1
d3d9.cachedDynamicBuffers = True
d3d9.deferSurfaceCreation = False
dxvk.numCompilerThreads = 4

# Persist compiled pipelines between runs so the second launch does not recompile them.
# NOTE: this file is only written on a clean exit. Killing the process (kill -9) loses it,
# which is why no cache existed during testing -- the harness always killed the game.
dxvk.enableStateCache = True
