;---------------------------------------------------------------------------------------------------
; custom.pointers.ini -- signature repairs for FFXI client 30251101_2 (and later 2025 builds)
;
; Ashita finds the game's functions and tables by scanning FFXiMain.dll for byte patterns. When
; Square Enix recompiles the client those patterns go stale; the pointer resolves to 0, and every
; addon that depends on it stops working with no error a player would ever see.
;
; On this client exactly two of Ashita 4.20's stock patterns miss:
;
;     ERROR | PointerManager::Update | Pointer: (00000000) [Error!] packets.queuepacket1
;     ERROR | PointerManager::Update | Pointer: (00000000) [Error!] player.haskeyitem
;
; The first is the expensive one. Without it `AddOutgoingPacket` is a silent no-op for EVERY
; addon -- nothing can talk to an NPC, choose a menu option, or send any action at all.
;
; Ashita reads this file after ashita.pointers.ini and overrides matching entries, so nothing
; here is lost when Ashita updates. Copy it to <install>\config\ashita\custom.pointers.ini.
;
; How these were derived is written up in docs/SIGNATURES.md -- including the addon that dumps
; the client's .text out of a live process, because FFXiMain.dll cannot be scanned on disk:
; its .text section has a raw size of zero and is unpacked at run time by the POL1 section.
;---------------------------------------------------------------------------------------------------

;---------------------------------------------------------------------------------------------------
; packets.queuepacket1  --  the outgoing-packet allocator
;
; Verified at 01D9BFB0 (rva 0xFBFB0) on 2026-08-25, base 01CA0000.
;
;   01D9BFB0  A128DB1702      mov eax, ds:[0217DB28]     ; the packet subsystem
;   01D9BFB5  56              push esi
;   01D9BFB6  85C0            test eax, eax
;   01D9BFB8  57              push edi
;   01D9BFB9  0F84DD000000    je   fail
;   01D9BFBF  8B74240C        mov  esi, [esp+0Ch]        ; arg1: packet id
;   01D9BFC3  81FE1E010000    cmp  esi, 11Eh             ; <-- WAS 120h. This one byte is the bug.
;   01D9BFC9  0F8DCD000000    jge  fail
;
; The function is byte-for-byte what Ashita expects apart from the bound on the packet-id table,
; which Square Enix moved from 0x120 to 0x11E. The constant is wildcarded here so the next
; change to it does not break the scan again; the pattern still matches exactly once in .text.
;---------------------------------------------------------------------------------------------------
[packets.queuepacket1]
module  = FFXiMain.dll
pattern = A1????????5685C0570F??????????8B74240C81FE????????0F8DCD0000008B
offset  = 0
count   = 0

;---------------------------------------------------------------------------------------------------
; player.haskeyitem  --  the key-item bitmap
;
; Verified at 01D27989 (rva 0x87989) on 2026-08-25; offset 50 lands on the disp32 of
;
;   01D279B8  853485880E1202  test dword ptr [eax*4 + 02120E88], esi
;   01D279BF  0F95C0          setne al
;
; so the pointer resolves to the address of 02120E88, which is the base of the key-item bitmap.
; The client now takes one argument (the key-item id) and does the divide/shift itself; the old
; pattern was written against a two-argument form that no longer exists.
;
; Confidence: the address is certain, the consumer's expectation is inferred from the stock
; entry's offset of 22 doing the same job. Lower confidence than the entry above. If key-item
; lookups misbehave, this is the line to remove -- it is not needed by anything in this project.
;---------------------------------------------------------------------------------------------------
[player.haskeyitem]
module  = FFXiMain.dll
pattern = 8B44240485C07C??3D000100007D??8BC85681E11F0000807905
offset  = 50
count   = 0
